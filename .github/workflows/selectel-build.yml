# Selectel production image + optional VDS deploy status.
# Green check on main = Docker image builds (same Dockerfile as VDS).
# Job "deploy" (main / manual) = tar+scp SHA → VDS extract → compose --build → /api/health.
# No git on VDS (same transfer pattern as selectel-rescue-sync).
# App tree on VDS: /opt/bober-ai/src (preserves rescue out/ + host deploy/.env at /opt/bober-ai).
#
# Secret: SELECTEL_SSH_KEY (same as selectel-rescue-sync)

name: selectel-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy on Selectel VDS (SSH + compose --build)"
        required: true
        default: true
        type: boolean

concurrency:
  group: selectel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker build (Selectel image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: bober-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PUBLIC_SITE_URL=https://www.bober-ai.dev
            PUBLIC_PARTNERS_SITE_URL=https://partners.bober-ai.dev
            PUBLIC_BITRIX_SITE_URL=https://bitrix.bober-ai.dev
            PUBLIC_YANDEX_METRIKA_ID=110635302
            PUBLIC_PARTNERS_YANDEX_METRIKA_ID=110926696
            PUBLIC_BITRIX_YANDEX_METRIKA_ID=110926887
            PUBLIC_CONTACT_EMAIL=contact@bober-ai.dev

      - name: Confirm image exists
        run: docker image inspect bober-ai:ci --format '{{.Id}} {{.Size}}'

  deploy:
    name: Deploy on Selectel VDS
    needs: docker-build
    if: >
      github.event_name == 'workflow_dispatch' && inputs.deploy == true
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SELECTEL_SSH_KEY: ${{ secrets.SELECTEL_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SELECTEL_SSH_KEY:-}" ]; then
            echo "::error::Missing secret SELECTEL_SSH_KEY (same key as selectel-rescue-sync)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SELECTEL_SSH_KEY" > ~/.ssh/bober_selectel
          chmod 600 ~/.ssh/bober_selectel
          ssh-keyscan -T 10 -H 45.80.131.136 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pack and upload source to VDS
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Same idea as selectel-rescue-sync: transfer via tar+scp (VDS has no git).
          tar -czf /tmp/bober-src.tgz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.astro' \
            --exclude='graphify-out' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='coverage' \
            --exclude='.cursor' \
            --exclude='.claude' \
            --exclude='.codex' \
            .
          echo "tarball=$(du -h /tmp/bober-src.tgz | awk '{print $1}') sha=$GIT_SHA"
          scp -i ~/.ssh/bober_selectel -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            /tmp/bober-src.tgz root@45.80.131.136:/tmp/bober-src.tgz

      - name: Build and restart on VDS
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/bober_selectel -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new root@45.80.131.136 \
            "GIT_SHA=$(printf %q "$GIT_SHA") GIT_REF=$(printf %q "$GIT_REF") bash -s" <<'EOS'
          set -euo pipefail
          ROOT=/opt/bober-ai
          REPO="$ROOT/src"
          STAGE="$ROOT/src.new"
          LOG=/var/log/bober-deploy.log
          READY="$ROOT/READY"
          TGZ=/tmp/bober-src.tgz
          mkdir -p "$ROOT"
          touch "$LOG" || true
          exec > >(tee -a "$LOG") 2>&1
          echo "=== selectel-build $(date -Is) sha=$GIT_SHA ref=$GIT_REF ==="
          [ -f "$TGZ" ] || { echo "NO_TARBALL $TGZ"; exit 1; }

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -C "$STAGE" -xzf "$TGZ"
          [ -f "$STAGE/Dockerfile" ] || { echo "NO_DOCKERFILE in tarball"; ls -la "$STAGE" | head; exit 1; }
          [ -f "$STAGE/deploy/docker-compose.yml" ] || { echo "NO_COMPOSE in tarball"; exit 1; }

          # Keep SMTP/leads env from previous tree or host deploy dir
          if [ -f "$REPO/deploy/.env" ]; then
            cp -a "$REPO/deploy/.env" "$STAGE/deploy/.env"
          elif [ -f "$ROOT/deploy/.env" ]; then
            cp -a "$ROOT/deploy/.env" "$STAGE/deploy/.env"
          elif [ -f "$ROOT/.env" ]; then
            cp -a "$ROOT/.env" "$STAGE/deploy/.env"
          fi

          rm -rf "$REPO.bak"
          if [ -d "$REPO" ]; then
            mv "$REPO" "$REPO.bak"
          fi
          mv "$STAGE" "$REPO"
          printf '%s\n' "$GIT_SHA" > "$REPO/.deploy-sha"
          echo "REPO=$REPO GIT_SHA=$GIT_SHA"

          COMPOSE_DIR="$REPO/deploy"
          COMPOSE_FILE="$COMPOSE_DIR/docker-compose.yml"
          [ -f "$COMPOSE_FILE" ] || { echo "NO_COMPOSE under $COMPOSE_DIR"; exit 1; }

          # VDS may have only plain docker (no compose plugin). Plain `docker … -d`
          # then fails with: unknown shorthand flag: 'd' in -d
          resolve_compose() {
            if docker compose version >/dev/null 2>&1; then
              dc=(docker compose)
            elif command -v docker-compose >/dev/null 2>&1; then
              dc=(docker-compose)
            else
              echo "compose missing — installing docker-compose-plugin"
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq docker-compose-plugin \
                || apt-get install -y -qq docker-compose
              if docker compose version >/dev/null 2>&1; then
                dc=(docker compose)
              elif command -v docker-compose >/dev/null 2>&1; then
                dc=(docker-compose)
              else
                echo "NO_DOCKER_COMPOSE after apt install"
                docker version || true
                exit 1
              fi
            fi
            echo "using: ${dc[*]}"
          }
          resolve_compose

          cd "$COMPOSE_DIR"
          "${dc[@]}" -f "$COMPOSE_FILE" up -d --build
          sleep 8
          "${dc[@]}" -f "$COMPOSE_FILE" ps
          curl -sf --connect-timeout 10 http://127.0.0.1:3000/api/health | head -c 500
          echo
          printf 'ok %s %s\n' "$GIT_SHA" "$(date -Is)" > "$READY"
          rm -f "$TGZ"
          echo "SELECTEL_DEPLOY_OK"
          EOS

      - name: Public health check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -sf --connect-timeout 10 https://www.bober-ai.dev/api/health; then
              echo
              echo "PUBLIC_HEALTH_OK"
              exit 0
            fi
            echo "retry $i…"
            sleep 5
          done
          echo "::error::Public /api/health failed after deploy"
          exit 1
