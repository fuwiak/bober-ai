services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        # Empty → Dockerfile resolves from config/domains.mjs
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
        PUBLIC_PARTNERS_SITE_URL: ${PUBLIC_PARTNERS_SITE_URL:-}
        PUBLIC_BITRIX_SITE_URL: ${PUBLIC_BITRIX_SITE_URL:-}
        PUBLIC_YANDEX_METRIKA_ID: ${PUBLIC_YANDEX_METRIKA_ID:-110635302}
        PUBLIC_PARTNERS_YANDEX_METRIKA_ID: ${PUBLIC_PARTNERS_YANDEX_METRIKA_ID:-110926696}
        PUBLIC_BITRIX_YANDEX_METRIKA_ID: ${PUBLIC_BITRIX_YANDEX_METRIKA_ID:-110926887}
        PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-contact@bober-systems.ru}
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: "0.0.0.0"
      # Must match Caddy reverse_proxy 127.0.0.1:3001 — never 3000.
      PORT: "3001"
      GIT_SHA: ${GIT_SHA:-}
      # Runtime wins over build-time Vite bake (feeds, absolute URLs).
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://www.bober-systems.ru}
      PUBLIC_PARTNERS_SITE_URL: ${PUBLIC_PARTNERS_SITE_URL:-https://partners.bober-systems.ru}
      PUBLIC_BITRIX_SITE_URL: ${PUBLIC_BITRIX_SITE_URL:-https://bitrix.bober-systems.ru}
      PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-contact@bober-systems.ru}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - leads_data:/app/data

  # Public TLS terminates on host container `bober-ai` (see selectel-build.yml).
  # Do not run a second Caddy here — it fights for :443 with the edge proxy.
  # Never run a manual `bober-web` on PORT=3000 — Caddy will 502.

volumes:
  leads_data:
