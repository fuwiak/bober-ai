services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://www.bober-ai.dev}
        PUBLIC_YANDEX_METRIKA_ID: ${PUBLIC_YANDEX_METRIKA_ID:-110635302}
        PUBLIC_PARTNERS_YANDEX_METRIKA_ID: ${PUBLIC_PARTNERS_YANDEX_METRIKA_ID:-110926696}
        PUBLIC_BITRIX_YANDEX_METRIKA_ID: ${PUBLIC_BITRIX_YANDEX_METRIKA_ID:-110926887}
        PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-contact@bober-ai.dev}
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-1}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      CONTACT_TELEGRAM_BOT_TOKEN: ${CONTACT_TELEGRAM_BOT_TOKEN:-}
      CONTACT_TELEGRAM_CHAT_ID: ${CONTACT_TELEGRAM_CHAT_ID:-}
      LEADS_LOG_PATH: ${LEADS_LOG_PATH:-/app/data/leads.jsonl}
      KWORK_WEBHOOK_SECRET: ${KWORK_WEBHOOK_SECRET:-}
    volumes:
      - leads_data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  leads_data:
  caddy_data:
  caddy_config:
