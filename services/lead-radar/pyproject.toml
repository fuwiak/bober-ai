[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-radar"
version = "0.1.0"
description = "Bober AI Lead Radar — Bitrix24 lead aggregation (Kwork + stubs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "pykwork>=0.0.6",
]

[project.scripts]
lead-radar = "lead_radar.__main__:main"

[tool.setuptools.packages.find]
include = ["lead_radar*"]
